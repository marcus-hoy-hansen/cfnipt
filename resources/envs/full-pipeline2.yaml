name: cfnipt-full2
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # CLI tools
  - bowtie2=2.5.*
  - samtools=1.17

  # Legacy Wisecondor (Python 2)
  - python=2.7
  - numpy=1.16.6
  - scipy=1.2.1
  - matplotlib=2.2.5
  - pysam=0.15.3

  # R / SeqFF / report
  - r-base=4.2.*
  - r-argparse
  - r-data.table
  - r-dplyr
  - r-ggplot2
  - r-optparse
  - r-tidyverse
  - r-rmarkdown
  - pandoc
  - r-tinytex
  - bioconductor-biocgenerics
  - bioconductor-s4vectors
  - bioconductor-iranges
  - bioconductor-xvector
  - bioconductor-biostrings
  - bioconductor-genomicranges
  - bioconductor-genomeinfodb

